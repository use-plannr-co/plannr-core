name: PlannrSwiftUI
options:
  bundleIdPrefix: com.sthareja19
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"

settings:
  SWIFT_VERSION: 5.9
  TARGETED_DEVICE_FAMILY: "1,2"

targets:
  PlannrSwiftUI:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "*.xcodeproj/**"
          - "*.xcworkspace/**"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sthareja19.PlannrSwiftUI
      PRODUCT_NAME: Plannr
      INFOPLIST_FILE: Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_VERSION: 5.9
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    entitlements:
      path: PlannrSwiftUI.entitlements
